<!doctype html><html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="L216 Frați">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b2849">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}html,body{height:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Transilvania 216 · Acces membri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first app shell — navy header band, one scrolling column of quiet cards, fixed tab bar at the bottom */
:root{
  --bg:#f5f4ef; --surface:#ffffff; --fg:#161d33; --muted:#5f6576; --line:#e0ded6;
  --navy:#1b2849; --gold:#a5802b; --gold-soft:#f1e8d2; --gold-ink:#7d5f19;
  --p:#1f7a4d; --p-soft:#dcefe3; --m:#a87410; --m-soft:#f5e9cc; --n:#b3362f; --n-soft:#f6dcda;
  --band:#1b2849; --band-fg:#f3eee0; --band-muted:rgb(243 238 224 / .7);
  --f-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --tabbar:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1322; --surface:#161d31; --fg:#ebe7dc; --muted:#9ba1b3; --line:#29314c;
  --navy:#c7d1ee; --gold:#d6b25e; --gold-soft:#332b1a; --gold-ink:#e3c681;
  --p:#5fcf93; --p-soft:#163828; --m:#e6b44c; --m-soft:#3a2e15; --n:#f07a71; --n-soft:#421f1d;
  --band:#090d19; --band-fg:#efe8d4; --band-muted:rgb(239 232 212 / .65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1322; --surface:#161d31; --fg:#ebe7dc; --muted:#9ba1b3; --line:#29314c;
  --navy:#c7d1ee; --gold:#d6b25e; --gold-soft:#332b1a; --gold-ink:#e3c681;
  --p:#5fcf93; --p-soft:#163828; --m:#e6b44c; --m-soft:#3a2e15; --n:#f07a71; --n-soft:#421f1d;
  --band:#090d19; --band-fg:#efe8d4; --band-muted:rgb(239 232 212 / .65); color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
button{font:inherit;color:inherit}
a{color:var(--gold-ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Header band */
.band{background:var(--band);color:var(--band-fg)}
.band .wrap{padding-block:18px 20px}
.crest{display:flex;align-items:center;gap:12px}
.crest svg,.crestimg{flex:none}
.outbtn{flex:none;align-self:flex-start;width:40px;height:40px;border-radius:10px;border:1px solid rgb(255 255 255 / .22);background:transparent;color:var(--band-fg);display:grid;place-items:center;cursor:pointer}
.crestimg{border-radius:50%;box-shadow:0 0 0 2px rgb(214 178 94 / .55);background:#fff;display:block}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.band h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;margin:4px 0 0;text-wrap:balance}
.band p{margin:6px 0 0;color:var(--band-muted);font-size:14px}

main{padding-block:16px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:22px;margin:8px 0 -4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 6px;font-size:15px;font-weight:600}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* Next ținută */
.next{background:var(--band);color:var(--band-fg);border:none;position:relative;overflow:hidden}
.next .label{color:var(--gold)}
.next .when{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;margin:6px 0 2px}
.next .where{color:var(--band-muted);font-size:14px}
.next .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgb(214 178 94 / .55);background:rgb(214 178 94 / .12);color:var(--band-fg);cursor:pointer;font-size:14px;font-weight:500}
.next::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border:1px solid rgb(214 178 94 / .18);border-radius:50%}

/* Pulse */
.pulse{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pulse .card{padding:12px}
.big{font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:14px;font-weight:500;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}

/* Lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none;padding-top:2px}
.item:last-child{padding-bottom:2px}
.datebox{width:46px;text-align:center;border-radius:10px;background:var(--gold-soft);color:var(--gold-ink);padding:5px 0;line-height:1.1}
.datebox b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.datebox span{font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rowbtn{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;cursor:pointer}
.rowbtn:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:6px}
.chev{color:var(--muted)}
.doci{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-ink);flex:none}

.news{display:flex;flex-direction:column;gap:10px}
.newsitem{border-left:3px solid var(--gold);padding-block:12px}
.newsitem h3{font-family:var(--f-display);font-size:21px;font-weight:700;margin:4px 0 4px;text-wrap:balance}
.newsitem p{margin:0;font-size:15px;color:var(--fg)}
.newslink{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-weight:600;font-size:14px;color:var(--gold-ink);text-decoration:none}
.lnav{display:flex;gap:6px;margin:4px 0 2px}
.navbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--gold-soft);color:var(--gold-ink);font-size:13px;font-weight:600;text-decoration:none}
.lodge{padding:11px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.lodge:first-child{border-top:none}
.lh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lh .t{font-weight:600}
.lodge .s{font-size:13px;color:var(--muted)}
.lc{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.lc a{user-select:text;overflow-wrap:anywhere}
.dress{margin-top:12px;font-size:13px;color:var(--band-muted)}
.dress .label{margin-right:6px}
a.chipbtn{text-decoration:none}
/* Ținute */
.tinuta-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tinuta-h h3{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0}
.cnt{min-width:28px;height:28px;padding:0 8px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--line);color:var(--fg)}
.go{cursor:pointer}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill.P{background:var(--p-soft);color:var(--p)}.pill.M{background:var(--m-soft);color:var(--m)}.pill.N{background:var(--n-soft);color:var(--n)}.pill.X{background:var(--line);color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-top:8px}
.photo{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;cursor:pointer;font-size:12px;max-width:100%}

/* Me */
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dot{min-width:54px;padding:6px 6px;border-radius:10px;text-align:center;font-size:11px;line-height:1.2;font-variant-numeric:tabular-nums}
.dot b{display:block;font-size:15px}
.dot.P{background:var(--p-soft);color:var(--p)}.dot.M{background:var(--m-soft);color:var(--m)}.dot.N{background:var(--n-soft);color:var(--n)}.dot.F{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.goal{display:flex;align-items:center;gap:10px;margin-top:8px}
.goal .mark{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.goal .mark.ok{background:var(--p);color:#fff}.goal .mark.no{border:1.5px solid var(--gold);color:var(--gold-ink)}

/* Directory */
.search{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font:inherit;color:var(--fg)}
.bro{border-top:1px solid var(--line)}
.bro:first-child{border-top:none}
.bro summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;cursor:pointer}
.bro summary::-webkit-details-marker{display:none}
.ini{width:38px;height:38px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font-weight:600;font-size:14px}
.bro .info{padding:0 0 12px 50px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.bro .info span{user-select:text}
.tag{font-size:11px;font-weight:600;color:var(--gold-ink);background:var(--gold-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}

/* Status + states */
.state{border-radius:14px;padding:16px;border:1px dashed var(--line);color:var(--muted);font-size:14px}
.state.err{border:1px solid var(--n);background:var(--n-soft);color:var(--fg)}
.skel{height:14px;border-radius:7px;background:var(--line);opacity:.6;margin:8px 0}
.skel.w60{width:60%}.skel.w40{width:40%}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin:0 auto;height:var(--tabbar)}
.tab{background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--gold-ink)}
.tab[aria-selected="true"] svg{stroke:var(--gold)}

/* Viewer */
.viewer{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.viewer header{background:var(--band);color:var(--band-fg);padding-top:env(safe-area-inset-top,0px)}
.viewer header .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.viewer header h2{flex:1;min-width:0;margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbtn{background:transparent;border:1px solid rgb(255 255 255 / .25);color:var(--band-fg);border-radius:10px;height:38px;padding:0 12px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-flex;align-items:center}
.vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 8px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:var(--line)}
.vpage{margin-inline:auto;background:#fff;box-shadow:0 1px 6px rgb(0 0 0 / .18);max-width:none}
.vimg{margin-inline:auto;max-width:100%;height:auto;border-radius:6px}
.vdoc{background:#fff;color:#1a1a1a;max-width:760px;width:100%;margin-inline:auto;padding:28px 22px;border-radius:6px;box-shadow:0 1px 6px rgb(0 0 0 / .18);font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.6;overflow-wrap:anywhere}
.vdoc h1,.vdoc h2,.vdoc h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance}
.vdoc table{border-collapse:collapse;width:100%;font-size:14px}.vdoc td,.vdoc th{border:1px solid #ccc;padding:4px 6px}
.vdoc img{max-width:100%;height:auto}
.vmsg{margin:auto;text-align:center;color:var(--muted);padding:24px}
.viewer .fallback{flex:1;display:grid;place-items:center;text-align:center;padding:24px}

/* Vizite anunțate */
button.navbtn{cursor:pointer;font-family:inherit}
.evgo{cursor:pointer}.evgo:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:8px}
.evn{margin-top:6px}
.excs{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.excs{grid-template-columns:1fr 1fr}}
.exc{cursor:pointer;margin:0;display:flex;flex-direction:column;gap:2px}
.exc:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.exc h3{font-family:var(--f-display);font-size:24px;line-height:1.1;margin:4px 0 2px}
.exc .s{font-size:14px;color:var(--muted)}
.exf{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:14px;font-weight:600;color:var(--gold-ink)}
.exinfo{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}
.exinfo dt{color:var(--muted)}.exinfo dd{margin:0}
.exprog{white-space:pre-line;font-size:15px;line-height:1.5;margin:0;overflow-wrap:anywhere}
.pers{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--line)}
.pers label{position:relative;display:grid;place-items:center;min-height:40px;border-radius:9px;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer}
.pers input{position:absolute;opacity:0;pointer-events:none}
.pers label:has(input:checked){background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.evhead{padding:4px 0 8px}.evhead h3{font-family:var(--f-display);font-size:30px;line-height:1.1;margin:6px 0 8px;text-wrap:balance}
.navbtn.ghost{background:transparent;color:var(--muted)}
.list .item.plan{align-items:start}
.plan .who{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:14px}
.plan .who + .who{margin-top:4px}
.plan .acts2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.plan .nota{margin-top:6px;font-size:13px;color:var(--gold-ink)}
.tag.ok{background:var(--p-soft);color:var(--p)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;margin-top:10px;border-radius:12px;border:1px dashed var(--gold);background:var(--gold-soft);color:var(--gold-ink);font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.fbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 0 calc(28px + env(safe-area-inset-bottom,0px))}
.fbody form{max-width:560px;margin:0 auto;padding:0 16px}
.fbody label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 6px;letter-spacing:.02em}
.fbody select,.fbody input[type=date],.fbody textarea{width:100%;box-sizing:border-box;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px;font:inherit;font-size:16px}
.fbody textarea{padding:10px 12px;min-height:84px;resize:vertical}
.fbody .hint{font-size:13px;color:var(--muted);margin-top:6px}
.fbody .check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:15px;cursor:pointer}
.fbody .check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--gold)}
.radios{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--line)}
.radios label{position:relative;display:grid;place-items:center;text-align:center;min-height:40px;padding:4px 6px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios label:has(input:checked){background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.radios label:has(input:focus-visible){outline:2px solid var(--gold)}
.primary{display:block;width:100%;height:52px;margin-top:22px;border:none;border-radius:12px;background:var(--gold);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.primary:disabled{opacity:.6;cursor:default}
.ferr{margin-top:12px;color:var(--n);font-size:14px}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px}
.login .box{max-width:380px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.login h1{font-family:var(--f-display);font-size:34px;line-height:1.05;margin:0}
.gbtn{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 20px;display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;color:var(--fg)}
.notice{font-size:12px;color:var(--muted);text-align:center;padding:10px 0 0}

/* Segmente + registru */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--line)}
.seg button{border:none;background:transparent;border-radius:9px;height:38px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.regwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.reg{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.reg th,.reg td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.reg thead th{font-size:11px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
.reg th[scope="row"],.reg thead th:first-child{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding-left:12px;padding-right:10px;font-weight:500;box-shadow:1px 0 0 var(--line)}
.reg tr.mine th[scope="row"],.reg tr.mine td{background:var(--gold-soft)}
.reg tfoot th,.reg tfoot td{font-weight:600;border-bottom:none;color:var(--muted)}
.reg .pct{font-weight:600;padding-right:12px}
.rc{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;font-weight:600;font-size:12px}
.rc.P{background:var(--p-soft);color:var(--p)}.rc.M{background:var(--m-soft);color:var(--m)}.rc.N{background:var(--n-soft);color:var(--n)}.rc.X{color:var(--muted)}
.gtl{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding-left:4px;border-left:2px solid var(--gold-soft)}
.gstep{display:flex;gap:10px;align-items:flex-start;margin-left:-9px}
.gdot{width:12px;height:12px;border-radius:50%;background:var(--gold);flex:none;margin-top:5px;box-shadow:0 0 0 3px var(--surface)}
.flist{margin-top:12px;display:flex;flex-direction:column;gap:4px;font-size:14px}

class ApiError extends Error{constructor(status,msg){super(msg);this.status=status}}

function googleAdapter(token){
  async function get(url){
    const r=await fetch(url,{headers:{Authorization:"Bearer "+token}});
    if(!r.ok)throw new ApiError(r.status,await r.text().catch(()=> ""));
    return r.json();
  }
  return {
    mode:"google",
    async file(id,mime){
      const isG=/^application\/vnd\.google-apps\./.test(mime||"");
      const u=isG?`https://www.googleapis.com/drive/v3/files/${id}/export?mimeType=application%2Fpdf`:`https://www.googleapis.com/drive/v3/files/${id}?alt=media`;
      const r=await fetch(u,{headers:{Authorization:"Bearer "+token}});
      if(!r.ok)throw new ApiError(r.status,"");
      return r.blob();
    },
    async me(){const u=await get("https://www.googleapis.com/oauth2/v3/userinfo");return {email:u.email,name:u.given_name||u.name||""}},
    async sheet(id,range){const j=await get(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(range)}`);return j.values||[]},
    async children(ids){
      const q="("+ids.map(i=>`'${i}' in parents`).join(" or ")+") and trashed=false";
      let out=[],pt="";
      do{
        const u="https://www.googleapis.com/drive/v3/files?pageSize=1000&orderBy=name&fields="+encodeURIComponent("nextPageToken,files(id,name,mimeType,parents,modifiedTime,webViewLink,shortcutDetails)")+"&q="+encodeURIComponent(q)+(pt?"&pageToken="+pt:"");
        const j=await get(u);out=out.concat(j.files||[]);pt=j.nextPageToken||"";
      }while(pt);
      return out.map(f=>{
        if(f.mimeType==="application/vnd.google-apps.shortcut"&&f.shortcutDetails){return {...f,id:f.shortcutDetails.targetId,mimeType:f.shortcutDetails.targetMimeType,parent:(f.parents||[])[0]}}
        return {...f,parent:(f.parents||[])[0]};
      });
    },
    async events(cal,from,to){
      const u=`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal)}/events?singleEvents=true&orderBy=startTime&maxResults=50&timeMin=${encodeURIComponent(from.toISOString())}&timeMax=${encodeURIComponent(to.toISOString())}`;
      const j=await get(u);return (j.items||[]).map(evMap);
    }
  };
}

function serverAdapter(token){
  async function call(action,extra){
    let r;
    try{r=await fetch(CONFIG.SERVICE_URL,{method:"POST",body:JSON.stringify(Object.assign({token,action},extra||{}))})}
    catch(e){throw new ApiError(0,"network")}
    let j;try{j=await r.json()}catch(_){throw new ApiError(r.status||500,"bad_response")}
    if(j&&j.error){const st=j.error==="unauthorized"?401:(j.error==="not_member"||j.error==="forbidden")?403:j.error==="bad_request"?400:500;const e=new ApiError(st,j.error);e.email=j.email;e.detail=j.message||"";throw e}
    return j;
  }
  const pl=jwtPayload(token)||{};
  return {
    mode:"google",
    async me(){return {email:String(pl.email||"").toLowerCase(),name:pl.given_name||""}},
    bootstrap(){return call("bootstrap")},
    planAdd(data){return call("plan_add",data)},
    planCancel(id){return call("plan_cancel",{id})},
    async file(id){const j=await call("file",{id});const bin=atob(j.b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:j.mime||"application/octet-stream"})}
  };
}

function mcpAdapter(mcp){
  const call=async(server,tool,input)=>{const r=await mcp.callTool(server,tool,input,{cache:{staleTime:60000}});let p=r.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(_){}}return p||{}};
  const pad=n=>String(n).padStart(2,"0");
  const local=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T00:00:00`;
  return {
    mode:"preview",
    async me(){return {email:"",name:"",previewName:CONFIG.PREVIEW_ME}},
    async sheet(id,range){const p=await call("Google Sheets","get_values",{spreadsheetId:id,range});return p.values||[]},
    async children(ids){
      const query=ids.map(i=>`parentId = '${i}'`).join(" or ");
      let out=[],pageToken=undefined,guard=0;
      do{
        const input={query,excludeContentSnippets:true,pageSize:100};if(pageToken)input.pageToken=pageToken;
        const p=await call("Google Drive","search_files",input);
        out=out.concat(p.files||[]);pageToken=p.nextPageToken;guard++;
      }while(pageToken&&guard<8);
      const seen=new Set();
      return out.filter(f=>!seen.has(f.id)&&seen.add(f.id)).map(f=>({id:f.id,name:f.title,mimeType:f.mimeType,parent:f.parentId,modifiedTime:f.modifiedTime,webViewLink:f.viewUrl}));
    },
    async events(cal,from,to){
      const p=await call("Google Calendar","list_events",{calendarId:cal,startTime:local(from),endTime:local(to),orderBy:"startTime",pageSize:50});
      return (p.events||[]).map(evMap);
    }
  };
}

function evMap(e){
  const allDay=!!(e.start&&e.start.date&&!e.start.dateTime);
  let start;
  if(allDay){const s=String(e.start.date).slice(0,10).split("-");start=new Date(+s[0],+s[1]-1,+s[2])}
  else start=new Date(e.start.dateTime);
  let endDay=null;if(e.end&&e.end.date){const x=String(e.end.date).slice(0,10).split("-");endDay=new Date(+x[0],+x[1]-1,+x[2])}
  const d0=new Date(start);d0.setHours(0,0,0,0);
  return {id:e.id||"",title:e.summary||"(fără titlu)",start,allDay,location:e.location||"",description:e.description||"",day:d0,endDay:endDay&&endDay>=d0?endDay:d0};
}

/* ============ AUTENTIFICARE (Google) ============ */
const AUTH_KEY="l216.auth", HINT_KEY="l216.hint", STATE_KEY="l216.state";
const SCOPES="openid email";
const NONCE_KEY="l216.nonce";
function jwtPayload(t){try{const b=t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");return JSON.parse(decodeURIComponent(escape(atob(b+"===".slice((b.length+3)%4)))))}catch(_){return null}}
const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
function savedToken(){try{const a=JSON.parse(store.get(AUTH_KEY)||"null");if(a&&a.exp>Date.now()+60000)return a.token}catch(_){}return null}
function redirectUri(){return location.origin+location.pathname}
function startLogin(silent){
  const state=Math.random().toString(36).slice(2);
  try{sessionStorage.setItem(STATE_KEY,state)}catch(_){}
  const nonce=Math.random().toString(36).slice(2)+Date.now().toString(36);
  try{sessionStorage.setItem(NONCE_KEY,nonce)}catch(_){}
  const p=new URLSearchParams({client_id:CONFIG.CLIENT_ID,redirect_uri:redirectUri(),response_type:"id_token",scope:SCOPES,state,nonce});
  const hint=store.get(HINT_KEY);
  if(silent&&hint){p.set("prompt","none");p.set("login_hint",hint)}else{p.set("prompt","select_account")}
  location.href="https://accounts.google.com/o/oauth2/v2/auth?"+p.toString();
}
function consumeRedirect(){
  if(!location.hash||location.hash.length<2)return null;
  const h=new URLSearchParams(location.hash.slice(1));
  if(!h.get("id_token")&&!h.get("error"))return null;
  history.replaceState(null,"",location.pathname+location.search);
  let expected=null;try{expected=sessionStorage.getItem(STATE_KEY)}catch(_){}
  if(h.get("error"))return {error:h.get("error")};
  if(expected&&h.get("state")!==expected)return {error:"state_mismatch"};
  const token=h.get("id_token"),pl=jwtPayload(token)||{};
  let nonce=null;try{nonce=sessionStorage.getItem(NONCE_KEY)}catch(_){}
  if(nonce&&pl.nonce&&pl.nonce!==nonce)return {error:"nonce_mismatch"};
  const exp=(pl.exp?pl.exp*1000:Date.now()+3600e3);
  store.set(AUTH_KEY,JSON.stringify({token,exp}));
  return {token};
}
function logout(){try{Object.keys(localStorage).filter(k=>k.indexOf("l216.")===0).forEach(k=>localStorage.removeItem(k))}catch(_){}location.reload()}

/* ============ ÎNCĂRCARE ============ */
async function loadAll(){
  const A=S.api,t0=today(),to=new Date(t0);to.setDate(to.getDate()+60);
  if(A.bootstrap){
    const CK="l216.cache."+(S.me.email||"");
    const apply=d=>{
      S.err={};
      ["roster","presence","visits","plates","lodges","news","tinuteTop","tinuteFiles","minutul","libTop","libFiles"].forEach(k=>S.data[k]=d[k]||[]);
      S.data.events=(d.events||[]).map(evMap);
      S.data.plans=d.plans||[];S.data.plansOn=Array.isArray(d.plans);
      S.data.excursions=d.excursions||[];
      if(d.errors&&d.errors.events)S.err.events={status:500};
      if(!CONFIG.SHOW_NEWS)S.data.news=[];
      if(d.me){S.me.key=d.me.key;S.me.fisa=d.me.fisa||null}
    };
    // 1) afișare imediată din ultima versiune salvată pe acest dispozitiv
    let cached=null;try{cached=JSON.parse(localStorage.getItem(CK)||"null")}catch(_){}
    if(cached){apply(cached);S.loading=false;build()}
    // 2) date proaspete în fundal
    try{
      const d=await A.bootstrap();
      apply(d);try{localStorage.setItem(CK,JSON.stringify(d))}catch(_){}
    }catch(e){
      if(e.status===401){store.del(AUTH_KEY);startLogin(true);return}
      if(e.status===403){try{localStorage.removeItem(CK)}catch(_){}S.data={};S.err.roster=e}
      else if(!cached)S.err.roster=e;
    }
    S.loading=false;build();return;
  }
  const jobs={
    roster:()=>A.sheet(CONFIG.SHEETS.roster,"'Frați activi'!A4:L200"),
    presence:()=>A.sheet(CONFIG.SHEETS.presence,"'Registru prezență'!A5:AZ200"),
    visits:()=>A.sheet(CONFIG.SHEETS.visits,"'Vizite'!A5:E1000"),
    plates:()=>A.sheet(CONFIG.SHEETS.plates,"'Planșe'!A5:J1000"),
    trunchi:()=>CONFIG.SHOW_TRUNCHI?A.sheet(CONFIG.SHEETS.trunchi,"'Situatie'!A3:J200"):Promise.resolve(null),
    events:()=>A.events(CONFIG.CALENDAR_ID,t0,to),
    lodges:()=>A.sheet(CONFIG.SHEETS.lodges,"A2:J100"),
    news:()=>CONFIG.SHOW_NEWS?A.sheet(CONFIG.SHEETS.news,"A2:E300"):Promise.resolve([]),
    tinuteTop:()=>A.children([CONFIG.FOLDERS.tinute]),
    minutul:()=>A.children([CONFIG.FOLDERS.minutul]),
    libTop:()=>A.children([CONFIG.FOLDERS.library])
  };
  const keys=Object.keys(jobs);
  const res=await Promise.allSettled(keys.map(k=>jobs[k]()));
  res.forEach((r,i)=>{if(r.status==="fulfilled")S.data[keys[i]]=r.value;else S.err[keys[i]]=r.reason});
  // a doua treaptă: conținutul folderelor de ținute și subfolderele bibliotecii
  const tf=(S.data.tinuteTop||[]).filter(f=>f.mimeType==="application/vnd.google-apps.folder"&&/^tinuta/i.test(norm(f.name)));
  const lf=(S.data.libTop||[]).filter(f=>f.mimeType==="application/vnd.google-apps.folder");
  const [a,b]=await Promise.allSettled([tf.length?A.children(tf.map(f=>f.id)):Promise.resolve([]),lf.length?A.children(lf.map(f=>f.id)):Promise.resolve([])]);
  if(a.status==="fulfilled")S.data.tinuteFiles=a.value;else S.err.tinuteFiles=a.reason;
  if(b.status==="fulfilled")S.data.libFiles=b.value;else S.err.libFiles=b.reason;
  S.loading=false;
  build();
}

const M={};
function build(){
  // frați
  M.bros=(S.data.roster||[]).filter(r=>/^\d+$/.test(String(r[0]||"").trim())&&r[1]).map(r=>({
    nume:String(r[1]).trim(),prenume:String(r[2]||"").trim(),birth:parseDMY(r[3]),grad:r[4]||"",functie:r[5]||"",demnitar:r[6]||"",
    profesie:r[7]||"",tel:r[8]||"",email:String(r[9]||"").trim().toLowerCase(),gacc:String(r[10]||"").trim().toLowerCase(),apel:String(r[11]||"").trim()||String(r[2]||"").trim().split(/\s+/)[0],key:keyOf(r[1],r[2])}));
  const byKey=new Map(M.bros.map(b=>[b.key,b]));M.byKey=byKey;
  // eu
  if(S.me.key)M.me=byKey.get(S.me.key)||null;
  else if(S.me.previewName)M.me=byKey.get(keyFromFull(S.me.previewName))||null;
  else{const em=String(S.me.email||"").toLowerCase();M.me=M.bros.find(b=>b.gacc&&b.gacc===em)||M.bros.find(b=>b.email&&b.email===em)||null}
  // prezență
  const pv=S.data.presence||[];const head=pv[0]||[];
  M.dates=[];head.forEach((h,i)=>{const d=parseDMY(h);if(d&&/^\d{2}\.\d{2}\.\d{2,4}$/.test(String(h).trim()))M.dates.push({d,col:i})});
  M.pres=new Map();M.presRows=[];
  for(let i=1;i<pv.length;i++){const r=pv[i]||[];if(!/^\d+$/.test(String(r[0]||"").trim())||!r[1])continue;
    const k=keyOf(r[1],r[2]);const vals=M.dates.map(x=>String(r[x.col]||"").trim().toUpperCase());M.pres.set(k,vals);
    M.presRows.push({key:k,name:String(r[1]).trim()+" "+String(r[2]||"").trim().split(/\s+/)[0],vals})}
  const t0=today();
  M.next=M.dates.find(x=>x.d>=t0)||null;
  // ultima ținută ținută (cu marcaje)
  M.last=null;
  for(let j=M.dates.length-1;j>=0;j--){if(M.dates[j].d>t0)continue;let c={P:0,M:0,N:0};M.pres.forEach(v=>{if(c[v[j]]!==undefined)c[v[j]]++});if(c.P+c.M+c.N>0){M.last={...M.dates[j],c,idx:j};break}}
  // vizite & planșe
  M.visits=(S.data.visits||[]).filter(r=>r[0]&&r[1]).map(r=>({d:parseDMY(r[0]),key:keyFromFull(r[1]),who:r[1],loja:r[2]||"",orient:r[3]||""}));
  M.plates=(S.data.plates||[]).filter(r=>r[1]&&r[2]).map(r=>({d:parseDMY(r[0]),key:keyFromFull(r[1]),who:r[1],titlu:r[2],unde:r[3]||"",loja:r[4]||"",grad:r[5]||"",tema:r[6]||"",site:r[7]||"",link:r[8]||""}));
  // documente ținute
  const tFolders=(S.data.tinuteTop||[]).filter(f=>f.mimeType==="application/vnd.google-apps.folder"&&/^tinuta/i.test(norm(f.name)));
  const files=S.data.tinuteFiles||[];
  const released=d=>!d||Date.now()>=new Date(d.getFullYear(),d.getMonth(),d.getDate(),21,0,0).getTime();
  const minutul=(S.data.minutul||[]).filter(f=>!/folder/.test(f.mimeType)).map(f=>({...f,d:parseDMY(f.name),label:minutulLabel(f.name)})).filter(f=>released(f.d));
  M.minutul=minutul;
  M.tinute=tFolders.map(f=>{
    const d=parseRoDate(f.name);
    const fs=files.filter(x=>x.parent===f.id);
    const minuta=fs.filter(x=>/minuta/i.test(x.name));
    const conv=fs.filter(x=>/convocator/i.test(x.name));
    const photos=fs.filter(x=>/^image\//.test(x.mimeType));
    const reg=minutul.filter(x=>d&&sameDay(x.d,d));
    const nr=(/tinuta\s*(\d+)/i.exec(norm(f.name))||[])[1];
    return {id:f.id,name:f.name,d,nr,minuta,conv,photos,reg};
  }).filter(t=>t.d);
  // următoarea ținută apare chiar fără folder; ținutele de după ea rămân ascunse
  const nx=M.next;
  if(nx&&!M.tinute.some(t=>sameDay(t.d,nx.d))){
    const idx=M.dates.indexOf(nx)+1;
    M.tinute.push({id:"",name:"",d:nx.d,nr:String(idx),minuta:[],conv:[],photos:[],reg:minutul.filter(x=>sameDay(x.d,nx.d))});
  }
  const limit=nx?nx.d:today();
  M.tinute=M.tinute.filter(t=>t.d<=limit||sameDay(t.d,limit)).sort((a,b)=>b.d-a.d);
  // planificate fără folder încă: adăugăm următoarea ținută pentru cardul de acasă
  // bibliotecă
  const top=S.data.libTop||[];const sub=S.data.libFiles||[];
  const groups=[];
  const loose=top.filter(f=>f.mimeType!=="application/vnd.google-apps.folder"&&f.id!==CONFIG.SHEETS.news&&f.id!==CONFIG.SHEETS.lodges);
  if(loose.length)groups.push({name:"Documente",files:loose});
  top.filter(f=>f.mimeType==="application/vnd.google-apps.folder").forEach(g=>{
    const fs=sub.filter(x=>x.parent===g.id&&x.mimeType!=="application/vnd.google-apps.folder");
    groups.push({name:g.name.replace(/^\d+[\.\s-]*/,""),files:fs});
  });
  M.lib=groups;
  // loji
  M.lodges=(S.data.lodges||[]).filter(r=>r[0]).map(r=>({nume:r[0],nr:r[1]||"",orient:r[2]||"",tinute:r[3]||"",contact:r[4]||"",functie:r[5]||"",tel:r[6]||"",email:r[7]||"",valid:r[8]||"",adresa:String(r[9]||"").trim()}));
  // știri
  M.news=(S.data.news||[]).filter(r=>r[2]).map(r=>{const pub=parseDMY(r[0])||t0;let until=parseDMY(r[1]);if(!until){until=new Date(pub);until.setDate(until.getDate()+14)}return {pub,until,titlu:r[2],text:r[3]||"",link:String(r[4]||"").trim()}}).filter(n=>n.pub<=t0&&n.until>=t0).sort((a,b)=>b.pub-a.pub);
  // evenimente
  M.events=(S.data.events||[]).filter(e=>!/^\s*🎂/.test(e.title)&&!/^ținută regulară/i.test(e.title));
  // aniversări (fără an)
  const in14=new Date(t0);in14.setDate(in14.getDate()+14);
  M.plans=(S.data.plans||[]).map(p=>({...p,d:parseDMY(p.date),key:keyFromFull(p.name)})).filter(p=>(p.d&&p.d>=t0)||/^ex:/.test(p.evt||"")).sort((a,b)=>(a.d||8e15)-(b.d||8e15)||String(a.name).localeCompare(b.name,"ro"));
  M.excursions=(S.data.excursions||[]).map(x=>({...x,d0:parseDMY(x.de),d1:parseDMY(x.pana)||parseDMY(x.de)})).filter(x=>!x.d1||x.d1>=t0).sort((a,b)=>(a.d0||8e15)-(b.d0||8e15));
  M.bdays=M.bros.filter(b=>b.birth).map(b=>{let n=new Date(t0.getFullYear(),b.birth.getMonth(),b.birth.getDate());if(n<t0)n.setFullYear(n.getFullYear()+1);return {b,n}}).filter(x=>x.n<=in14).sort((a,b)=>a.n-b.n);
  render();
}
function minutulLabel(name){
  const base=String(name).replace(/\.[a-z]+$/i,"").replace(/_/g," ");
  const m=/\d{1,2}\.\d{1,2}\.\d{2,4}\s*(.*)$/.exec(base);
  const t=m&&m[1]?m[1].trim():"";
  return t?cap(t.toLowerCase()):"Minutul de regularitate";
}

function errText(e){
  if(!e)return "";const c=e.code||e.status;
  if(c==="server_not_connected")return "Conectorul Google nu e conectat în claude.ai.";
  if(c==="needs_reauth")return "Reconectează conectorul Google în claude.ai → Setări → Conectori.";
  if(c==="not_in_manifest"||c==="approval_required")return "Permite accesul la Google când pagina îl cere, apoi reîncarcă.";
  if(c===401)return "Sesiunea a expirat. Reîncarcă pagina.";
  if(c===403||c===404)return "Contul tău nu are acces la acest document.";
  return "Verifică conexiunea și încearcă din nou.";
}

function pdfLine(items){let out="",p=null;for(const it of items){if(!("str" in it))continue;const t=it.transform,x=t[4],y=t[5],fs=Math.hypot(t[0],t[1])||10;
  if(p){const same=Math.abs(y-p.y)<fs*0.3;out+=(!same||x-(p.x+p.w)>fs*0.12)?" ":""}out+=it.str;p={x,y,w:it.width};if(it.hasEOL){out+=" ";p=null}}return out}
async function fillAgapa(f){
  if(!$("#agapa")||!S.api.file)return;
  const key="l216.conv2."+f.id+"."+(f.modifiedTime||"");
  let info=null;try{info=JSON.parse(localStorage.getItem(key)||"null")}catch(_){}
  if(!info){
    try{
      const blob=await S.api.file(f.id,f.mimeType);const lib=await loadPdfJs();
      const pdf=await lib.getDocument({data:await blob.arrayBuffer()}).promise;let all="";
      for(let p=1;p<=pdf.numPages;p++){const c=await (await pdf.getPage(p)).getTextContent();all+=" "+pdfLine(c.items)}
      const n=all.replace(/\s+/g," ").replace(/ ([,.;:])/g,"$1");
      const m=/agap\s?[ăa][^.;]{0,40}/i.exec(n);
      const agapa=!m?"":/non\s*-?\s*ritual/i.test(m[0])?"Agapă non-ritualică":/ritual/i.test(m[0])?"Agapă ritualică":"Agapă";
      const d=/dress\s*code\s*:\s*([^.]{5,160}\.)/i.exec(n);
      info={agapa,dress:d?d[1].trim():""};
      try{localStorage.setItem(key,JSON.stringify(info))}catch(_){}
    }catch(_){return}
  }
  const a=$("#agapa");if(a&&info.agapa){a.innerHTML=`<span class="label">După ținută</span> ${esc(info.agapa)}`;a.hidden=false}
  const dr=$("#dress");if(dr&&info.dress)dr.innerHTML=`<span class="label">Ținuta</span> ${esc(info.dress)}`;
}

function openDoc(id,name,mime,link){
  const el=document.createElement("div");el.className="viewer";el.setAttribute("role","dialog");el.setAttribute("aria-label",name);
  const canRender=S.api.mode==="google";
  const isImg=/^image\//.test(mime||"");
  const isDocx=/wordprocessingml\.document$/.test(mime||"");
  const isPdfable=/pdf$/.test(mime||"")||/^application\/vnd\.google-apps\.(document|presentation|spreadsheet)/.test(mime||"");
  const body=!canRender?`<div class="fallback"><div><p><strong>${esc(name)}</strong></p><p class="muted small">În aplicația finală documentul se deschide chiar aici, pe tot ecranul.<br>În previzualizare îl poți deschide în Drive.</p>${link?`<p><a href="${esc(link)}" target="_blank" rel="noopener">Deschide în Drive</a></p>`:""}</div></div>`
    :`<div class="vbody" id="vbody"><div class="vmsg">Se deschide documentul…</div></div>`;
  el.innerHTML=`<header><div class="wrap"><button class="vbtn" type="button" id="vclose">Închide</button><h2>${esc(name)}</h2>${canRender&&isPdfable?`<button class="vbtn" type="button" id="vzoom" aria-label="Mărește">100%</button>`:""}</div></header>${body}`;
  document.body.append(el);document.body.style.overflow="hidden";
  let urls=[],alive=true;
  const close=()=>{alive=false;urls.forEach(u=>URL.revokeObjectURL(u));el.remove();document.body.style.overflow=""};
  el.querySelector("#vclose").onclick=close;
  el.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  el.querySelector("#vclose").focus();
  if(!canRender)return;
  const box=el.querySelector("#vbody");
  const fail=msg=>{box.innerHTML=`<div class="vmsg"><p>${esc(msg)}</p>${link?`<p><a href="${esc(link)}" target="_blank" rel="noopener">Deschide în Drive</a></p>`:""}</div>`};
  if(!isImg&&!isPdfable&&!isDocx){fail("Acest tip de fișier nu poate fi afișat în aplicație.");return}
  S.api.file(id,mime).then(async blob=>{
    if(!alive)return;
    if(isImg){const u=URL.createObjectURL(blob);urls.push(u);box.innerHTML=`<img class="vimg" src="${u}" alt="${esc(name)}">`;return}
    if(isDocx){const m=await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js","mammoth");const r=await m.convertToHtml({arrayBuffer:await blob.arrayBuffer()});if(!alive)return;box.innerHTML=`<article class="vdoc">${r.value}</article>`;return}
    const lib=await loadPdfJs();
    const pdf=await lib.getDocument({data:await blob.arrayBuffer()}).promise;
    let zoom=1;
    const draw=async()=>{
      box.innerHTML="";const w=Math.min(box.clientWidth-16,1100)*zoom;const dpr=Math.min(window.devicePixelRatio||1,2.5);
      for(let p=1;p<=pdf.numPages&&alive;p++){
        const page=await pdf.getPage(p);const v0=page.getViewport({scale:1});const sc=w/v0.width;const v=page.getViewport({scale:sc*dpr});
        const c=document.createElement("canvas");c.width=Math.floor(v.width);c.height=Math.floor(v.height);c.style.width=Math.floor(v.width/dpr)+"px";c.className="vpage";
        box.append(c);await page.render({canvasContext:c.getContext("2d"),viewport:v}).promise;
      }
    };
    await draw();
    const zb=el.querySelector("#vzoom");if(zb)zb.onclick=()=>{zoom=zoom>=2?1:zoom+0.5;zb.textContent=Math.round(zoom*100)+"%";draw()};
  }).catch(e=>fail(e&&e.status===403||e&&e.status===404?"Nu ai acces la acest document.":"Documentul nu s-a putut deschide. Verifică conexiunea și încearcă din nou."));
}
const _scripts={};
function loadScript(src,global){
  if(_scripts[src])return _scripts[src];
  _scripts[src]=new Promise((res,rej)=>{const el=document.createElement("script");el.src=src;el.onload=()=>res(window[global]);el.onerror=()=>{delete _scripts[src];rej(new Error(global))};document.head.append(el)});
  return _scripts[src];
}
let _pdfjs=null;
function loadPdfJs(){
  if(_pdfjs)return _pdfjs;
  _pdfjs=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib)};
    s.onerror=()=>{_pdfjs=null;rej(new Error("pdfjs"))};document.head.append(s)});
  return _pdfjs;
}

    <button class="gbtn" type="button" id="login"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Intră cu contul Google</button>
    ${msg?`<p style="color:#ffb4ad;margin:0;font-size:14px">${esc(msg)}</p>`:""}
    <p class="notice" style="color:var(--band-muted)">Acces rezervat membrilor.</p>
  </div></div></div>`;
  $("#login").onclick=()=>startLogin(false);
}

async function boot(){
  // 1) previzualizare în claude.ai, cu conectorii proprietarului
  let mcp=null;
  if(window.claude&&typeof window.claude.use==="function"){try{mcp=await window.claude.use("mcp")}catch(_){mcp=null}}
  if(mcp){S.api=mcpAdapter(mcp);S.me=await S.api.me();render();loadAll();return}
  // 2) aplicația reală, cu autentificare Google
  if(!CONFIG.CLIENT_ID){$("#app").innerHTML=`<div class="wrap" style="padding-block:40px"><div class="state err">Aplicația nu e încă configurată: lipsește identificatorul Google (CLIENT_ID).</div></div>`;return}
  const r=consumeRedirect();
  let token=r&&r.token||savedToken();
  if(!token){
    if(r&&r.error&&r.error!=="access_denied"&&store.get(HINT_KEY)&&r.error!=="interaction_required"&&r.error!=="login_required"&&r.error!=="consent_required"){loginScreen("Autentificarea nu a reușit. Încearcă din nou.");return}
    if(!r&&store.get(HINT_KEY)){startLogin(true);return}
    loginScreen(r&&r.error==="access_denied"?"Autentificarea a fost anulată.":"");return;
  }
  if(!CONFIG.SERVICE_URL){$("#app").innerHTML=`<div class="wrap" style="padding-block:40px"><div class="state err">Serviciul nu este încă configurat.</div></div>`;return}
  S.api=serverAdapter(token);
  try{S.me=await S.api.me();store.set(HINT_KEY,S.me.email||"")}
  catch(e){if(e.status===401){store.del(AUTH_KEY);startLogin(true);return}loginScreen("Nu am putut verifica contul. Încearcă din nou.");return}
  render();loadAll();
}
render=(orig=>function(){if(!S.api)return;orig()})(render);

/* ============ ACTUALIZĂRI AUTOMATE ============ */
const APP_VERSION="2026.10.18-22";
async function checkVersion(){
  if(S.api&&S.api.mode!=="google")return;
  try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const j=await r.json();if(j.version&&j.version!==APP_VERSION)location.reload()}catch(_){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkVersion()});
setInterval(checkVersion,15*60*1000);

checkVersion();boot();
</script>
